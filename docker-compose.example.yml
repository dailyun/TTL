services:
  todotodolist:
    image: todotodolist:local
    build: .
    ports:
      - "3000:3000"
    environment: &execution-environment
      NODE_ENV: production
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_OWNER: ${GITHUB_OWNER}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_SNAPSHOT_PATH: ${GITHUB_SNAPSHOT_PATH:-todotodolist/snapshot.json}
      HUMAN_SOURCE_ID: ${HUMAN_SOURCE_ID:-findwork}
      HUMAN_SOURCE_PATH: ${HUMAN_SOURCE_PATH:-findwork/**/*.md}
      HUMAN_SOURCE_SECTION: ${HUMAN_SOURCE_SECTION:-work}
      TODOTODOLIST_PASSWORD: ${TODOTODOLIST_PASSWORD}
      TODOTODOLIST_AUTH_SECRET: ${TODOTODOLIST_AUTH_SECRET}
      TODOTODOLIST_API_TOKEN: ${TODOTODOLIST_API_TOKEN}
      TODOTODOLIST_API_ALLOWED_ORIGINS: ${TODOTODOLIST_API_ALLOWED_ORIGINS}
      TODOTODOLIST_PUBLIC_URL: ${TODOTODOLIST_PUBLIC_URL}
      TODOTODOLIST_STATE_PATH: /data/execution.json
      TODOTODOLIST_CHECKIN_PATH: /data/execution.json
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      GOOGLE_REFRESH_TOKEN_PATH: ${GOOGLE_REFRESH_TOKEN_PATH:-/data/google-calendar-token.json}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_CALENDAR_SECTION: ${GOOGLE_CALENDAR_SECTION:-work}
      GOOGLE_CALENDAR_WEBHOOK_URL: ${GOOGLE_CALENDAR_WEBHOOK_URL}
      GOOGLE_CALENDAR_SYNC_STATE_PATH: ${GOOGLE_CALENDAR_SYNC_STATE_PATH:-/data/google-calendar-sync-state.json}
      GOOGLE_CALENDAR_FALLBACK_POLL_SECONDS: ${GOOGLE_CALENDAR_FALLBACK_POLL_SECONDS:-300}
      GOOGLE_CALENDAR_INITIAL_DAYS_BACK: ${GOOGLE_CALENDAR_INITIAL_DAYS_BACK:-30}
      GOOGLE_CALENDAR_INITIAL_DAYS_FORWARD: ${GOOGLE_CALENDAR_INITIAL_DAYS_FORWARD:-365}
      GOOGLE_CALENDAR_WATCH_TTL_SECONDS: ${GOOGLE_CALENDAR_WATCH_TTL_SECONDS:-518400}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  execution-worker:
    image: todotodolist:local
    command: ["node", "--import", "tsx", "scripts/execution-worker.ts"]
    restart: unless-stopped
    depends_on:
      todotodolist:
        condition: service_healthy
    environment: *execution-environment
    volumes:
      - ./data:/data
