name: Bug report
description: Report a reproducible problem with TodoTodoList.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Use synthetic tasks and example.com domains. Remove tokens, private schedules, and deployment addresses from all examples.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the commit SHA or branch you tested.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node.js version, deployment mode, and enabled integrations. Do not paste environment files.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a minimal synthetic example. Include timezone and event dates for calendar problems.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a redacted error message if available.
    validations:
      required: true
